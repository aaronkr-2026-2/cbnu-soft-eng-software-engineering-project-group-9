[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cospeaklocal"
version = "0.1.0"
description = "English-only text/speech-to-isolated-ASL-pose prototype"
requires-python = "~=3.12.0"
dependencies = [
    "numpy>=1.26,<3",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
extract = ["mediapipe==0.10.20"]
speech = ["faster-whisper>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
